<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer</title>
<!--
  prism-timer — countdown and interval (docs/concept-scenes.md §6, schema §24).

  Served by the host at https://tiles.prism/timer/ from Assets/tiles. ZERO
  network. It runs on device time: the deadline is an epoch millisecond in the
  host store (§10), so a reload, a scene change or a whole restart picks the
  run back up — and says plainly when it does.

  The chime is the bundled local WAV beside this page (§24: local, offline-proof,
  volume-respecting). It is generated by scripts/make-chime.mjs, so its licence
  is "we made it". It plays at the level on the slider and nowhere else: nothing
  raises that level, and Chime off means silent.
-->
<link rel="stylesheet" href="../shared/tiles.css">
<style>
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--gap) * 0.4);
  }

  .remaining {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    /* the number is the tile: as big as the shorter side allows, at any class */
    font-size: min(26vmin, 34vw);
    color: var(--ink);
  }
  .remaining.running { color: var(--accent); }
  .remaining.finished { color: var(--ok); }

  .stage .caption { color: var(--ink-dim); font-size: var(--small); text-align: center; line-height: 1.35; }

  .modes { display: flex; gap: calc(var(--gap) * 0.5); }
  .modes button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .presets { display: flex; flex-wrap: wrap; gap: calc(var(--gap) * 0.5); }
  .presets button { flex: 1 1 auto; min-width: calc(var(--tap) * 1.1); }

  .transport { display: flex; gap: calc(var(--gap) * 0.6); }
  .transport button { flex: 1 1 auto; }
  .transport button.primary { flex: 2 1 auto; }

  .sound { display: flex; align-items: center; gap: var(--gap); }
  .sound input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .sound .level { font-family: var(--mono); font-size: var(--small); color: var(--ink-dim); min-width: 3.5ch; text-align: right; }

  /* A finished timer pulses once a second so it reads from across a room —
     unless the household asked for less motion (tiles.css turns it off). */
  @keyframes zero-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .remaining.finished.alarming { animation: zero-pulse 1s ease-in-out infinite; }
</style>
</head>
<body>

<header class="tile-head">
  <h1 id="title">Timer</h1>
  <span class="meta" id="meta"></span>
</header>

<div class="offline" id="offline" hidden>
  This page is part of Prism and keeps its timer on the device it runs on. It is
  open outside Prism right now, so nothing here can be saved.
</div>

<div class="banner" id="restored" hidden>
  <span class="grow" id="restored-text"></span>
  <button class="ghost" type="button" id="restored-ok">OK</button>
</div>

<div class="stage">
  <div class="remaining" id="remaining">5:00</div>
  <div class="caption" id="caption"></div>
</div>

<div class="row modes" role="group" aria-label="Mode">
  <button type="button" id="mode-countdown" data-mode="countdown" aria-pressed="true">Countdown</button>
  <button type="button" id="mode-interval" data-mode="interval" aria-pressed="false">Interval</button>
</div>

<div class="presets" id="presets" role="group" aria-label="Presets"></div>

<div class="row transport">
  <button class="primary" type="button" id="start">Start</button>
  <button type="button" id="reset">Reset</button>
</div>

<div class="row sound">
  <button class="ghost" type="button" id="chime" aria-pressed="true">Chime on</button>
  <input type="range" id="volume" min="0" max="100" step="5" value="60" aria-label="Chime volume">
  <span class="level" id="level">60%</span>
</div>

<audio id="tone" src="../shared/chime.wav" preload="auto"></audio>

<script src="../shared/tiles.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "tiles:timer";
  var T = window.PrismTiles;

  var elRemaining = document.getElementById("remaining");
  var elCaption = document.getElementById("caption");
  var elMeta = document.getElementById("meta");
  var elPresets = document.getElementById("presets");
  var elStart = document.getElementById("start");
  var elReset = document.getElementById("reset");
  var elChime = document.getElementById("chime");
  var elVolume = document.getElementById("volume");
  var elLevel = document.getElementById("level");
  var elTone = document.getElementById("tone");
  var elOffline = document.getElementById("offline");
  var elRestored = document.getElementById("restored");
  var elRestoredText = document.getElementById("restored-text");
  var modeButtons = [document.getElementById("mode-countdown"), document.getElementById("mode-interval")];

  var doc = null;
  var firstDoc = true;
  var alarming = false;
  /** The lap we have already sounded for, so a chime never repeats on a re-render. */
  var soundedLap = -1;

  if (!T.connected) {
    elOffline.hidden = false;
    elStart.disabled = elReset.disabled = elChime.disabled = elVolume.disabled = true;
  }

  function send(intent) { if (T.connected) T.apply(KEY, intent); }

  /** Remaining from the deadline alone — device time, no server, no drift. */
  function remainingMs(now) {
    if (!doc) return 0;
    if (!doc.running || doc.endsAt === null) return doc.remainingMs;
    return Math.max(0, doc.endsAt - now);
  }

  function renderPresets() {
    if (!doc) return;
    var presets = doc.presets || [];
    var html = "";
    for (var i = 0; i < presets.length; i++) {
      var m = presets[i];
      var active = Math.round(doc.durationMs / 60000) === m && !doc.running;
      html += '<button type="button" data-min="' + m + '"' + (active ? ' aria-pressed="true"' : "") + ">" + m + " min</button>";
    }
    elPresets.innerHTML = html;
  }

  function paint() {
    if (!doc) return;
    var now = Date.now();
    var left = remainingMs(now);
    var finished = doc.running && left <= 0;

    elRemaining.textContent = T.clock(left);
    elRemaining.className = "remaining" +
      (finished ? " finished" + (alarming ? " alarming" : "") : doc.running ? " running" : "");

    var caption;
    if (finished) caption = doc.mode === "interval" ? "Interval " + (doc.laps + 1) + " — starting again" : "Time";
    else if (doc.running) caption = doc.mode === "interval"
      ? "Interval " + (doc.laps + 1) + " · ends " + T.at(doc.endsAt) + " · repeats until you stop it"
      : "Ends " + T.at(doc.endsAt);
    else if (left === doc.durationMs) caption = doc.mode === "interval" ? "Repeats until stopped" : "Ready";
    else caption = "Paused";
    elCaption.textContent = caption;

    elStart.textContent = doc.running ? "Pause" : (left > 0 && left !== doc.durationMs ? "Resume" : "Start");
    elReset.disabled = !T.connected;
    elMeta.textContent = doc.mode === "interval" && doc.laps > 0 ? doc.laps + " done" : "";

    for (var i = 0; i < modeButtons.length; i++) {
      modeButtons[i].setAttribute("aria-pressed", modeButtons[i].getAttribute("data-mode") === doc.mode ? "true" : "false");
    }
    elChime.textContent = doc.chime ? "Chime on" : "Chime off";
    elChime.setAttribute("aria-pressed", doc.chime ? "true" : "false");
  }

  /** §24: local tone, at the level the household set, once per lap. Off is silent. */
  function sound() {
    if (!doc || !doc.chime || doc.volume <= 0) return;
    try {
      elTone.volume = Math.max(0, Math.min(1, doc.volume));
      elTone.currentTime = 0;
      var p = elTone.play();
      if (p && p.catch) p.catch(function () { /* a surface with no audio route stays silent, never throws at the wall */ });
    } catch (e) { /* as above */ }
  }

  /** Once a second: repaint, and at zero tell core (which rolls an interval over or stops a countdown). */
  function tick() {
    if (!doc) return;
    var left = remainingMs(Date.now());
    if (doc.running && left <= 0) {
      if (!alarming) {
        alarming = true;
        if (soundedLap !== doc.laps) { soundedLap = doc.laps; sound(); }
        // core advances the deadline (interval) or stops the run (countdown)
        send({ op: "timer.tick" });
      }
    } else if (left > 0) {
      alarming = false;
    }
    paint();
  }

  /** After a reload or a restart, say what happened rather than pretending nothing did. */
  function announceRestore() {
    if (!doc) return;
    var now = Date.now();
    if (doc.running && doc.endsAt !== null && doc.endsAt <= now) {
      elRestoredText.textContent = "Restored: this timer reached zero at " + T.at(doc.endsAt) +
        ", while the panel was away." + (doc.mode === "interval" ? " The interval has been caught up." : "");
      elRestored.hidden = false;
    } else if (doc.running) {
      elRestoredText.textContent = "Restored: still running — " + T.clock(remainingMs(now)) + " left, ending " + T.at(doc.endsAt) + ".";
      elRestored.hidden = false;
    } else if (doc.remainingMs > 0 && doc.remainingMs !== doc.durationMs) {
      elRestoredText.textContent = "Restored: paused with " + T.clock(doc.remainingMs) + " left.";
      elRestored.hidden = false;
    }
  }

  document.getElementById("restored-ok").addEventListener("click", function () { elRestored.hidden = true; });

  elStart.addEventListener("click", function () {
    if (!doc) return;
    elRestored.hidden = true;
    if (doc.running && remainingMs(Date.now()) <= 0) { send({ op: "timer.reset" }); alarming = false; return; }
    send({ op: doc.running ? "timer.pause" : "timer.start" });
  });
  elReset.addEventListener("click", function () { alarming = false; elRestored.hidden = true; send({ op: "timer.reset" }); });

  elPresets.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button[data-min]") : null;
    if (!btn) return;
    alarming = false;
    send({ op: "timer.set", durationMs: parseInt(btn.getAttribute("data-min"), 10) * 60000 });
  });

  for (var i = 0; i < modeButtons.length; i++) {
    modeButtons[i].addEventListener("click", function (ev) {
      alarming = false;
      send({ op: "timer.set", mode: ev.currentTarget.getAttribute("data-mode") });
    });
  }

  elChime.addEventListener("click", function () { if (doc) send({ op: "timer.sound", chime: !doc.chime }); });
  elVolume.addEventListener("input", function () { elLevel.textContent = elVolume.value + "%"; });
  elVolume.addEventListener("change", function () { send({ op: "timer.sound", volume: parseInt(elVolume.value, 10) / 100 }); });

  T.onDoc(function (key, incoming) {
    if (key !== KEY || !incoming) return;
    var previous = doc;
    doc = incoming;
    if (!previous || previous.laps !== doc.laps || !doc.running) alarming = remainingMs(Date.now()) <= 0 && doc.running;
    if (document.activeElement !== elVolume) {
      elVolume.value = String(Math.round(doc.volume * 100));
      elLevel.textContent = elVolume.value + "%";
    }
    renderPresets();
    if (firstDoc) { firstDoc = false; soundedLap = doc.laps; announceRestore(); }
    paint();
  });

  setInterval(tick, 250);
  paint();
  T.get(KEY);
})();
</script>
</body>
</html>
